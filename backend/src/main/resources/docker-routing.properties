# ==================================================================================
# [하이브리드 길찾기 라우팅 엔진 설정 파일 (docker-routing.properties)]
# ==================================================================================
# 목적: 매물 ↔ 목적지 간의 안심 도보 경로 및 대중교통 이동시간 연산 엔진을 제어합니다.
#
# ■ 1. 모드 설정 (routing.engine.mode)
#  ---------------------------------------------------------------------------------
#  • DOCKER (권장) :
#      - 로컬 도커 기반의 오픈소스 라우팅 하이브리드 엔진을 사용합니다.
#      - [Valhalla]       : 골목길 보행자 경로 및 CCTV/보안등 안전 가중치 연산
#      - [GraphHopper PT] : 수도권 GTFS 기반 버스/지하철 대중교통 이동시간 연산
#      - 장점: 외부 API 호출량/과금 한도 없음(무제한 무료), 수백 건 동시 병렬 연산 지원
#      - ★ 자동 안전 폴백(Safe Fallback):
#          도커 컨테이너가 켜져 있지 않거나 연결에 실패해도 서버 오류 없이
#          자동으로 기존 TMAP API로 즉시 전환되어 정상 작동합니다.
#
#  • TMAP :
#      - 기존 SK Open API TMAP 보행자 경로 API를 단독으로 사용합니다.
# ==================================================================================
routing.engine.mode=${ROUTING_ENGINE_MODE:DOCKER}

# ==================================================================================
# ■ 2. 로컬 도커 / 배포 터널(Railway) 엔드포인트 URL
#  ---------------------------------------------------------------------------------
#  - 로컬 실행 시: localhost 기본값 사용
#  - Railway 배포 시: Railway 대시보드 환경변수(ROUTING_VALHALLA_URL 등)가 1순위 적용
# ==================================================================================
routing.valhalla.url=${ROUTING_VALHALLA_URL:http://localhost:8000}
routing.motis.url=${ROUTING_MOTIS_URL:http://localhost:8001}
routing.graphhopper.url=${ROUTING_GRAPHHOPPER_URL:http://localhost:8001}
